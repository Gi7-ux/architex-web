<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bird Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .bird-container {
            width: 200px;
            height: 150px;
            position: relative;
        }
        #origami-bird {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            animation: breakingFree 15s ease-in-out infinite;
        }
        @keyframes breakingFree {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                filter: drop-shadow(0 0 0 rgba(106, 141, 115, 0));
            }
            10% {
                transform: translate(0, -20px) scale(1.1);
                filter: drop-shadow(0 5px 15px rgba(106, 141, 115, 0.3));
            }
            20% {
                transform: translate(50px, -40px) scale(1.2) rotate(10deg);
                filter: drop-shadow(0 10px 20px rgba(106, 141, 115, 0.4));
            }
            30% {
                transform: translate(100px, -20px) scale(1.3) rotate(5deg);
                filter: drop-shadow(0 15px 25px rgba(106, 141, 115, 0.5));
            }
            40% {
                transform: translate(150px, 0) scale(1.4) rotate(0deg);
                filter: drop-shadow(0 20px 30px rgba(106, 141, 115, 0.6));
            }
            50% {
                transform: translate(200px, 20px) scale(1.5) rotate(-5deg);
                filter: drop-shadow(0 25px 35px rgba(106, 141, 115, 0.7));
            }
            60% {
                transform: translate(150px, 40px) scale(1.4) rotate(-10deg);
                filter: drop-shadow(0 20px 30px rgba(106, 141, 115, 0.6));
            }
            70% {
                transform: translate(100px, 20px) scale(1.3) rotate(-5deg);
                filter: drop-shadow(0 15px 25px rgba(106, 141, 115, 0.5));
            }
            80% {
                transform: translate(50px, 0) scale(1.2) rotate(0deg);
                filter: drop-shadow(0 10px 20px rgba(106, 141, 115, 0.4));
            }
            90% {
                transform: translate(0, -20px) scale(1.1) rotate(5deg);
                filter: drop-shadow(0 5px 15px rgba(106, 141, 115, 0.3));
            }
        }
    </style>
</head>
<body>
    <div class="bird-container">
        <img id="origami-bird" src="assets/origami.png" alt="Origami Bird">
    </div>
</body>
</html>
