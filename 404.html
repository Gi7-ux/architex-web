<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Architex">
    <meta name="author" content="Architex">
    <title>Page Not Found - Architex</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="fonts.css?v=1.0.1">
    <link rel="stylesheet" href="styles.css?v=1.0.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-family: 'Freedom', 'Montserrat', sans-serif;
        }

        .error-message {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--text-color);
        }

        .error-description {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: #666;
        }

        .error-bird {
            width: 200px;
            margin: 2rem auto;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        .home-button {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .home-button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <main>
            <div class="error-container">
                <div class="error-code">404</div>
                <h1 class="error-message">Page Not Found</h1>
                <p class="error-description">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
                <div class="error-bird">
                    <img src="assets/origami.png" alt="Origami Bird" />
                </div>
                <a href="index.html" class="home-button">Return to Home</a>
            </div>
        </main>
    </div>
</body>
</html>
