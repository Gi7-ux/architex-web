<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        .bounceCardsContainer {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 400px;
        }

        .card {
            position: absolute;
            width: 200px;
            aspect-ratio: 1;
            border: 5px solid #fff;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card .image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="bounceCardsContainer">
        <!-- Cards will be added here dynamically -->
    </div>

    <script>
        const config = {
            containerWidth: 400,
            containerHeight: 400,
            animationDelay: 0.5,
            animationStagger: 0.06,
            easeType: "elastic.out(1, 0.8)",
            transformStyles: [
                "rotate(10deg) translate(-170px)",
                "rotate(5deg) translate(-85px)",
                "rotate(-3deg)",
                "rotate(-10deg) translate(85px)",
                "rotate(2deg) translate(170px)"
            ],
            enableHover: true,
            images: [
                "image1.jpg",
                "image2.jpg",
                "image3.jpg",
                "image4.jpg",
                "image5.jpg"
            ]
        };

        function getNoRotationTransform(transformStr) {
            const hasRotate = /rotate\([\s\S]*?\)/.test(transformStr);
            if (hasRotate) {
                return transformStr.replace(/rotate\([\s\S]*?\)/, "rotate(0deg)");
            } else if (transformStr === "none") {
                return "rotate(0deg)";
            } else {
                return `${transformStr} rotate(0deg)`;
            }
        }

        function getPushedTransform(baseTransform, offsetX) {
            const translateRegex = /translate\(([-0-9.]+)px\)/;
            const match = baseTransform.match(translateRegex);
            if (match) {
                const currentX = parseFloat(match[1]);
                const newX = currentX + offsetX;
                return baseTransform.replace(translateRegex, `translate(${newX}px)`);
            } else {
                return baseTransform === "none"
                    ? `translate(${offsetX}px)`
                    : `${baseTransform} translate(${offsetX}px)`;
            }
        }

        function pushSiblings(hoveredIdx) {
            if (!config.enableHover) return;
            config.images.forEach((_, i) => {
                gsap.killTweensOf(`.card-${i}`);

                const baseTransform = config.transformStyles[i] || "none";

                if (i === hoveredIdx) {
                    const noRotationTransform = getNoRotationTransform(baseTransform);
                    gsap.to(`.card-${i}`, {
                        transform: noRotationTransform,
                        duration: 0.4,
                        ease: "back.out(1.4)",
                        overwrite: "auto"
                    });
                } else {
                    const offsetX = i < hoveredIdx ? -160 : 160;
                    const pushedTransform = getPushedTransform(baseTransform, offsetX);

                    const distance = Math.abs(hoveredIdx - i);
                    const delay = distance * 0.05;

                    gsap.to(`.card-${i}`, {
                        transform: pushedTransform,
                        duration: 0.4,
                        ease: "back.out(1.4)",
                        delay,
                        overwrite: "auto"
                    });
                }
            });
        }

        function resetSiblings() {
            if (!config.enableHover) return;
            config.images.forEach((_, i) => {
                gsap.killTweensOf(`.card-${i}`);
                const baseTransform = config.transformStyles[i] || "none";
                gsap.to(`.card-${i}`, {
                    transform: baseTransform,
                    duration: 0.4,
                    ease: "back.out(1.4)",
                    overwrite: "auto"
                });
            });
        }

        // Initialize cards
        const container = document.querySelector('.bounceCardsContainer');
        config.images.forEach((src, idx) => {
            const card = document.createElement('div');
            card.className = `card card-${idx}`;
            card.style.transform = config.transformStyles[idx] ?? "none";
            
            const img = document.createElement('img');
            img.className = 'image';
            img.src = src;
            img.alt = `card-${idx}`;
            
            card.appendChild(img);
            card.addEventListener('mouseenter', () => pushSiblings(idx));
            card.addEventListener('mouseleave', resetSiblings);
            
            container.appendChild(card);
        });

        // Initial animation
        gsap.fromTo(
            ".card",
            { scale: 0 },
            {
                scale: 1,
                stagger: config.animationStagger,
                ease: config.easeType,
                delay: config.animationDelay
            }
        );
    </script>
</body>
</html>
