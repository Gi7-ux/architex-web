<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Bird Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .test-container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        img {
            max-width: 200px;
            max-height: 150px;
            border: 1px dashed #999;
            padding: 5px;
        }
        h2 {
            color: #6a8d73;
        }
        .status {
            margin-top: 10px;
            font-weight: bold;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Bird Image Loading Tests</h1>
    
    <div class="test-container">
        <h2>Test 1: Direct Image Tag</h2>
        <img src="assets/origami.png" alt="Bird Test 1" id="test1">
        <div class="status" id="status1"></div>
    </div>
    
    <div class="test-container">
        <h2>Test 2: Image with Full Path</h2>
        <img src="/assets/origami.png" alt="Bird Test 2" id="test2">
        <div class="status" id="status2"></div>
    </div>
    
    <div class="test-container">
        <h2>Test 3: Image with Absolute URL</h2>
        <img src="http://localhost:3000/assets/origami.png" alt="Bird Test 3" id="test3">
        <div class="status" id="status3"></div>
    </div>
    
    <div class="test-container">
        <h2>Test 4: Alternative Image</h2>
        <img src="assets/bird.png" alt="Bird Test 4" id="test4">
        <div class="status" id="status4"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Test functions
            function testImage(imgId, statusId) {
                const img = document.getElementById(imgId);
                const status = document.getElementById(statusId);
                
                img.onload = () => {
                    status.textContent = "✓ Image loaded successfully";
                    status.className = "status success";
                    console.log(`${imgId} loaded successfully`);
                };
                
                img.onerror = () => {
                    status.textContent = "✗ Failed to load image";
                    status.className = "status error";
                    console.error(`${imgId} failed to load`);
                };
                
                // If image is already loaded
                if (img.complete) {
                    if (img.naturalWidth === 0) {
                        status.textContent = "✗ Failed to load image";
                        status.className = "status error";
                        console.error(`${imgId} failed to load (already complete)`);
                    } else {
                        status.textContent = "✓ Image loaded successfully";
                        status.className = "status success";
                        console.log(`${imgId} loaded successfully (already complete)`);
                    }
                }
            }
            
            // Run tests
            testImage('test1', 'status1');
            testImage('test2', 'status2');
            testImage('test3', 'status3');
            testImage('test4', 'status4');
        });
    </script>
</body>
</html>
